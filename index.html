<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tidewater</title>
<style>
  html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 30%,#12324a,#06121a 70%);color:#e8f1f8;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
  #game{position:fixed;inset:0}
  #keys{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:12px;opacity:.7;letter-spacing:.02em;text-shadow:0 1px 3px #000;pointer-events:none}
  #touch{display:none;position:fixed;left:0;right:0;bottom:10px;justify-content:space-between;padding:0 14px;z-index:5}
  #touch div{display:flex;gap:10px}
  #touch button{width:64px;height:64px;border-radius:50%;border:2px solid #9ad0ff;background:rgba(47,128,237,.35);color:#fff;font-size:22px}
  #end{display:none;position:fixed;inset:0;background:rgba(4,14,22,.82);backdrop-filter:blur(6px);align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:10;text-align:center;padding:20px}
  #end h2{margin:0;font-size:36px;font-weight:700;letter-spacing:.01em}#end-stats{color:#9ad0ff}
  #rate{display:flex;gap:8px}
  #rate button,#again{padding:10px 16px;font-size:18px;border-radius:8px;border:2px solid #9ad0ff;background:#12324a;color:#fff;cursor:pointer}
  #thanks{display:none}
  #rate button.sel{outline:3px solid #ffd166;outline-offset:2px;background:#1d4f73}
  #mute{position:fixed;top:10px;right:12px;z-index:11;width:38px;height:38px;border-radius:50%;border:2px solid #9ad0ff;background:rgba(18,50,74,.7);color:#fff;font-size:18px;cursor:pointer;padding:0;line-height:1}
  #mute:hover{background:#1d4f73}
  body{touch-action:none}
  #touch button{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .08s,background .08s}
  #touch button:active{transform:scale(.9);background:rgba(47,128,237,.75)}
  #rate button,#again{transition:transform .12s,background .12s}
  #rate button:hover,#again:hover{background:#1d4f73;transform:translateY(-2px)}
  #rate button:focus-visible,#again:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
  #title{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;background:radial-gradient(ellipse at 50% 30%,#12324a,#06121a 70%)}
  #title h1{margin:0;font-size:64px;letter-spacing:.06em;font-weight:800}#title small{color:#9ad0ff}
  #title button,#panel button{padding:10px 22px;font-size:18px;border-radius:8px;border:2px solid #9ad0ff;background:#12324a;color:#fff;cursor:pointer}
  #title button:hover,#panel button:hover{background:#1d4f73}
  #cfg{position:fixed;top:10px;right:58px;z-index:16;width:38px;height:38px;border-radius:50%;border:2px solid #9ad0ff;background:rgba(18,50,74,.7);color:#fff;font-size:18px;cursor:pointer;padding:0;line-height:1}
  #panel{display:none;position:fixed;inset:0;z-index:20;background:rgba(4,14,22,.85);backdrop-filter:blur(6px);align-items:center;justify-content:center;flex-direction:column;gap:14px}
  #panel label{display:flex;gap:12px;align-items:center;justify-content:space-between;width:260px}
  #panel input[type=range]{width:140px}
  #game{filter:saturate(.8) contrast(1.18) brightness(.66);transition:filter .5s}
  body.dead:not(.color) #game{filter:grayscale(1) contrast(1.25) brightness(.62);transition:filter .12s}
  body.color #game{filter:none}
  #prog{position:fixed;left:0;right:0;top:0;height:4px;background:rgba(255,255,255,.12);z-index:12}
  #prog i{position:absolute;top:-3px;width:10px;height:10px;border-radius:50%;background:#dfe8ee;margin-left:-5px;left:0;transition:left .12s linear}
  #title h1{font-weight:400;color:#cdd6dc;text-shadow:0 0 18px rgba(154,208,255,.25)}
  #title button,#panel button,#again{position:relative}
  .gpb{display:none;position:absolute;left:50%;top:100%;transform:translate(-50%,7px);min-width:18px;height:18px;padding:0 6px;box-sizing:border-box;border-radius:9px;background:var(--c,#4b5563);color:#fff;font:700 10px/18px system-ui,sans-serif;letter-spacing:.03em;text-align:center;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.6);pointer-events:none;z-index:30}
  .gpb::before{content:"";position:absolute;left:50%;top:-4px;margin-left:-4px;border:4px solid transparent;border-top:0;border-bottom:4px solid var(--c,#4b5563)}
  body.pad .gpb{display:block}
  body:not(.color)::after{content:"";position:fixed;inset:0;z-index:9;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 50%,rgba(0,0,0,.55) 100%)}
</style>
</head>
<body>
<div id="game"></div>
<div id="prog"><i id="prog-dot"></i></div>
<div id="title"><h1>TIDEWATER</h1><button id="play">Play</button><small>or press any key / A</small><button id="title-cfg">Settings</button></div>
<button id="cfg" title="Settings (Esc)">⚙</button>
<div id="panel"><h2 style="margin:0">Settings</h2>
  <label>Music <input id="vol-music" type="range" min="0" max="100"></label>
  <label>Effects <input id="vol-sfx" type="range" min="0" max="100"></label>
  <label>Mute (M) <input id="mute-opt" type="checkbox"></label>
  <label>Show hitboxes (H) <input id="hit-opt" type="checkbox"></label>
  <button id="panel-close">Close</button></div>
<button id="mute" title="Sound (M)"><span class="ico">🔊</span></button>
<div id="touch">
  <div><button id="t-left">◀</button><button id="t-right">▶</button></div>
  <div><button id="t-pull">○</button><button id="t-jump">▲</button></div>
</div>
<div id="end">
  <h2>Level complete!</h2>
  <div id="end-stats"></div>
  <div id="rate-wrap">
    <p>How fair did failing feel?<br><small>1 = very unfair · 5 = very fair</small></p>
    <div id="rate"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button></div>
  </div>
  <div id="thanks">Thank you!</div>
  <button id="again">Play again</button>
</div>
<!-- Vercel Speed Insights (sitio estatico). Solo reporta cuando esta desplegado en Vercel con Speed Insights activado; en local el script no existe y se ignora. -->
<script>window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<script src="vendor/phaser.min.js"></script>
<script src="sprites.js"></script>
<script src="water.js"></script>
<script src="game.js"></script>
</body>
</html>
